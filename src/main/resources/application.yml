server:
  # Local default 8080; Elastic Beanstalk supplies PORT=5000 (see .ebextensions).
  port: ${PORT:8080}

spring:
  application:
    name: glofox-memberships-application
  jackson:
    # Global snake_case on the wire, so no DTO needs @JsonProperty. Note that
    # default-property-inclusion is deliberately NOT set: the contract requires
    # credits and remaining_slots to be PRESENT with a null value, so a client
    # can tell "unlimited" from "field missing". Adding non_null here would
    # break that contract.
    property-naming-strategy: SNAKE_CASE

memberships:
  payment:
    # How long a purchase waits for the gateway before failing with
    # 502 payment_gateway_error. A charge that lands later is logged at ERROR
    # for reconciliation (see TimeoutPaymentGateway).
    timeout: 5s
    # Charges allowed in flight at once. When all are held (a hung gateway),
    # new charges fail fast with 502 instead of tying up servlet threads.
    max-concurrent-charges: 50

logging:
  level:
    root: INFO
    com.glofox.memberships: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
